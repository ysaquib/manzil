# CI per IMPLEMENTATION.md §2: ruff, mypy --strict on shared/, pytest in replay
# mode (a replay miss fails the build — CI cannot spend tokens), plus the
# Phase 1 frontend job (eslint + vitest + build against the committed API types).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    env:
      MANZIL_LLM_MODE: replay
      MANZIL_WORKER_INPROCESS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.98.2
      - run: uv sync --all-packages
      - run: supabase start
      - run: supabase db reset --yes
      - name: Export local Supabase environment
        shell: bash
        run: |
          supabase status -o json | jq -er '
            "SUPABASE_URL=\(.API_URL)",
            "SUPABASE_ANON_KEY=\(.ANON_KEY)",
            "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)",
            "DATABASE_URL=\(.DB_URL)"
          ' >> "$GITHUB_ENV"
      - run: uv run --package manzil-shared pytest shared/tests
      - run: uv run --package manzil-api pytest api/tests --ignore=api/tests/test_rls_matrix.py
      - run: uv run --package manzil-worker pytest worker/tests

  collaboration-security:
    runs-on: ubuntu-latest
    env:
      MANZIL_LLM_MODE: replay
      MANZIL_WORKER_INPROCESS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.98.2
      - run: uv sync --all-packages
      - run: supabase start
      - run: supabase db reset --yes
      - name: Export local Supabase environment
        shell: bash
        run: |
          supabase status -o json | jq -er '
            "SUPABASE_URL=\(.API_URL)",
            "SUPABASE_ANON_KEY=\(.ANON_KEY)",
            "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)",
            "DATABASE_URL=\(.DB_URL)"
          ' >> "$GITHUB_ENV"
      - run: uv run --package manzil-api pytest api/tests/test_rls_matrix.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # `build` runs tsc against the committed API types, catching drift from the API.
      - run: pnpm build
