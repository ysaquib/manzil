# CI per IMPLEMENTATION.md §2: ruff, mypy --strict on shared/, pytest in replay
# mode (a replay miss fails the build — CI cannot spend tokens), plus the
# Phase 1 frontend job (eslint + vitest + build against the committed API types).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    env:
      MANZIL_LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run --package manzil-shared pytest shared/tests
      - run: uv run --package manzil-api pytest api/tests
      - run: uv run --package manzil-worker pytest worker/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # `build` runs tsc against the committed API types, catching drift from the API.
      - run: pnpm build
