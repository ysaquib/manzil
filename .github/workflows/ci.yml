# CI per IMPLEMENTATION.md §2: ruff, mypy --strict on shared/, pytest in replay
# mode (a replay miss fails the build — CI cannot spend tokens), plus the
# Phase 1 frontend job (eslint + vitest + build against the committed API types).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Release PRs are opened with GITHUB_TOKEN, whose recursion guard suppresses
  # the ordinary pull_request event. release.yml dispatches this exact same CI
  # workflow against that branch so the PR still carries the normal checks.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Cheap, and it runs *here* on purpose: a bad email-template path fails
      # `supabase start` at the first step of the test job, before Docker, with
      # an error naming a random entry. This says which one and why.
      - run: uv run python scripts/check_supabase_config.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    env:
      MANZIL_LLM_MODE: replay
      MANZIL_WORKER_INPROCESS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: uv sync --all-packages
      - name: Reset and verify local Supabase
        env:
          MANZIL_SUPABASE_DIAGNOSTICS: ${{ runner.temp }}/supabase-ci-diagnostics
        run: bash .github/scripts/setup-supabase-ci.sh
      - name: Upload Supabase setup diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: supabase-setup-test
          path: ${{ runner.temp }}/supabase-ci-diagnostics
          if-no-files-found: ignore
      - run: uv run --package manzil-shared pytest shared/tests
      - run: uv run --package manzil-api pytest api/tests --ignore=api/tests/test_rls_matrix.py
      - run: uv run --package manzil-worker pytest worker/tests

  collaboration-security:
    runs-on: ubuntu-latest
    env:
      MANZIL_LLM_MODE: replay
      MANZIL_WORKER_INPROCESS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: uv sync --all-packages
      - name: Reset and verify local Supabase
        env:
          MANZIL_SUPABASE_DIAGNOSTICS: ${{ runner.temp }}/supabase-ci-diagnostics
        run: bash .github/scripts/setup-supabase-ci.sh
      - name: Upload Supabase setup diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: supabase-setup-collaboration-security
          path: ${{ runner.temp }}/supabase-ci-diagnostics
          if-no-files-found: ignore
      - run: uv run --package manzil-api pytest api/tests/test_rls_matrix.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # `build` runs tsc against the committed API types, catching drift from the API.
      - run: pnpm build

  docker-api-image:
    # GitHub withholds repository secrets from Dependabot-triggered workflows,
    # even though Dependabot's PR head belongs to this repository. Build the
    # secret-backed production image on ordinary same-repository PRs and pushes;
    # the push build remains the required verification for Dependabot changes.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      MANZIL_CLIP_ARCHIVE_URL: ${{ secrets.MANZIL_CLIP_ARCHIVE_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Build production API image
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MANZIL_CLIP_ARCHIVE_URL//[[:space:]]/}" ]]; then
            echo "::error::Repository secret MANZIL_CLIP_ARCHIVE_URL is missing or blank. Set it to the authenticated HTTPS URL for the pinned CLIP ONNX archive."
            exit 1
          fi
          trap 'rm -f /tmp/manzil_clip_archive_url' EXIT
          printf '%s' "$MANZIL_CLIP_ARCHIVE_URL" > /tmp/manzil_clip_archive_url
          DOCKER_BUILDKIT=1 docker build \
            --platform linux/amd64 \
            --secret id=manzil_clip_archive_url,src=/tmp/manzil_clip_archive_url \
            -t manzil-api:ci \
            .
      - name: Validate image contents
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --env SUPABASE_URL=https://ci.invalid \
            --env SUPABASE_ANON_KEY=ci-anon-key \
            --env SUPABASE_SECRET_KEY=ci-secret-key \
            --env DATABASE_URL=postgresql://ci:ci@localhost:5432/ci \
            --env MANZIL_WORKER_INPROCESS=false \
            manzil-api:ci \
            /app/.venv/bin/python -c 'import manzil_api.main'
          docker run --rm manzil-api:ci /app/.venv/bin/python -c \
            'from pathlib import Path; from manzil_worker.vision_onnx import artifact_digest, ONNX_SHADOW_ARTIFACT_SHA256; \
             p=Path("/app/.manzil/models/clip-vision-uint8"); \
             assert artifact_digest(p)==ONNX_SHADOW_ARTIFACT_SHA256'
          docker run --rm manzil-api:ci /app/.venv/bin/python -c \
            'from manzil_worker.llm.prompt_loader import load_prompt; \
             [load_prompt(s) for s in ("extract","verify","vision","discover")]'
          docker run --rm manzil-api:ci /app/.venv/bin/python -c \
            'from manzil_worker.vision_refs import VISION_REFS_DIR, vision_references_ready; \
             assert (VISION_REFS_DIR / "manifest.json").is_file(), VISION_REFS_DIR; \
             assert vision_references_ready()'
          docker run --rm manzil-api:ci /app/.venv/bin/playwright --version
      - name: Require ONNX build secret
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          set -euo pipefail
          if DOCKER_BUILDKIT=1 docker build --no-cache --platform linux/amd64 \
               -t manzil-api:no-secret . 2>/dev/null; then
            echo "Expected build to fail without ONNX secret"
            exit 1
          fi

  deploy-production-db:
    # Must name both branches, because `on: push` above triggers on both and this
    # repository's default branch is `master` — gating on `refs/heads/main` alone
    # meant every merge to master ran the checks and then silently skipped the
    # deploy. Keep this expression identical to the `Require ONNX build secret`
    # step's: they answer the same question ("is this a release push?") and the
    # bug was the two of them disagreeing.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [lint, typecheck, test, collaboration-security, frontend, docker-api-image]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-database
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --dry-run
      - run: supabase db push
      - run: supabase migration list
