name: Production readiness

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: true

jobs:
  probe:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the production API origin
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: test -n "$PRODUCTION_API_URL"
      - name: Probe operational readiness
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        # Render startup currently takes about 45 seconds before the first byte.
        # One 60-second attempt plus one retry stays bounded by the job timeout.
        run: >-
          curl --fail --silent --show-error
          --max-time 60 --retry 1 --retry-all-errors
          "$PRODUCTION_API_URL/v1/ready"
