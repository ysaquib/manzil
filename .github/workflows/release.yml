name: Product release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  pull_request:
    branches: [main, master]
    types: [closed]
    paths:
      - VERSION
      - CHANGELOG.md

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Calculate version and roll changelog
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python scripts/bump_version.py '${{ inputs.bump }}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open release-version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/v${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Branch $branch already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): prepare v${VERSION}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore(release): v${VERSION}" \
            --body "Manual SemVer release PR for v${VERSION}. CI must pass and this PR must merge before the tag and GitHub Release are created. Review the generated changelog section and add any final release notes here before merging."
          # GITHUB_TOKEN-created PRs do not emit a second workflow event. An
          # explicit dispatch runs the ordinary CI definition on this commit.
          gh workflow run ci.yml --ref "$branch"

  publish:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Verify release PR and publish tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::VERSION is not SemVer: $version"
            exit 1
          fi
          if [[ "$HEAD_BRANCH" != "release/v${version}" ]]; then
            echo "::error::Release branch $HEAD_BRANCH does not match VERSION $version"
            exit 1
          fi
          files="$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')"
          grep -qx 'VERSION' <<<"$files"
          grep -qx 'CHANGELOG.md' <<<"$files"
          unexpected="$(grep -Ev '^(VERSION|CHANGELOG\.md)$' <<<"$files" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Release PR changed unexpected files: $unexpected"
            exit 1
          fi
          gh pr checks "$PR_NUMBER" --required
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists; nothing to publish."
            exit 0
          fi
          gh release create "v${version}" \
            --target "$TARGET_SHA" \
            --title "v${version}" \
            --generate-notes
