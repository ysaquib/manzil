[project]
name = "manzil"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.61.0",
    "pytest-playwright>=0.8.0",
    "rich>=15.0.0",
]

[tool.uv.workspace]
members = [
    "shared",
    "api",
    "worker",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's API is function calls in argument defaults — B008 is a false positive there
"worker/src/manzil_worker/cli.py" = ["B008"]

[tool.mypy]
strict = true
files = ["shared/src/manzil_shared"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "api/tests", "worker/tests"]
asyncio_mode = "auto"
