[project]
name = "manzil-shared"
version = "0.1.0"
description = "Manzil domain models, criteria catalog, and scoring engine. Domain-blind, LLM-free."
authors = [
    { name = "Yusuf Saquib", email = "contact@yusufsaquib.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
