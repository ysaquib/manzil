[project]
name = "manzil-api"
version = "0.1.0"
description = "Manzil API service (FastAPI): validated mutations + the in-process worker loop (Phase 1)."
authors = [
    { name = "Yusuf Saquib", email = "yusufsaquib@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "manzil-shared",
    "manzil-worker",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "supabase>=2.7",
    "jsonschema>=4.22",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv.sources]
manzil-shared = { workspace = true }
manzil-worker = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
