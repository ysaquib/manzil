[project]
name = "manzil-worker"
version = "0.1.0"
description = "Manzil agent pipeline worker: fetch tiers, stages, runner, LLM client seam."
authors = [
    { name = "Yusuf Saquib", email = "yusufsaquib@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "manzil-shared",
    "typer>=0.12",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "readability-lxml>=0.8",
    "lxml>=5",
    "playwright>=1.47",
    "structlog>=24",
    "asyncpg>=0.29",
    "langfuse>=4",
    "openai>=1.0",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
vision-onnx = [
    "numpy>=2",
    "onnxruntime>=1.20",
]
vision-bench = [
    "numpy>=2",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pyarrow>=18",
    "sentencepiece>=0.2",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.49,<5",
]

[project.scripts]
manzil = "manzil_worker.cli:app"
manzil-worker = "manzil_worker.service:main"

[tool.uv.sources]
manzil-shared = { workspace = true }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
