[project]
name = "manzil-worker"
version = "0.1.0"
description = "Manzil agent pipeline worker: fetch tiers, stages, runner, LLM client seam."
authors = [
    { name = "Yusuf Saquib", email = "yusufsaquib@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "manzil-shared",
    "typer>=0.12",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "readability-lxml>=0.8",
    "lxml>=5",
    "playwright>=1.47",
    "structlog>=24",
    "asyncpg>=0.29",
    "langfuse>=4",
    "openai>=1.0",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[project.scripts]
manzil = "manzil_worker.cli:app"

[tool.uv.sources]
manzil-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
